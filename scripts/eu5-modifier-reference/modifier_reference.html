<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU5 Country Modifiers</title>
<script>
try {
	const t = localStorage.getItem('eu5-ref-theme');
	document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
} catch (_) {
	document.documentElement.dataset.theme = 'light';
}
</script>
<style>
html { background: oklch(0.965 0.006 70); }
html[data-theme="dark"] { background: oklch(0.18 0.011 70); color: oklch(0.965 0.006 70); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400..700&family=Noto+Sans:wght@400..600&family=Noto+Sans+Mono:wght@400..600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
<style type="text/tailwindcss">
/*@css*/
</style>
<script src="https://cdn.jsdelivr.net/npm/@floating-ui/core@1.8.0/dist/floating-ui.core.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.8.0/dist/floating-ui.dom.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app"><p style="padding: 2rem; font-family: system-ui, sans-serif">Loading the modifier reference… It needs an internet connection to load its libraries.</p></div>

<script type="text/x-template" id="app-template">
<div class="flex h-dvh flex-col">
	<header class="flex shrink-0 flex-wrap items-center gap-x-3 gap-y-2 border-b border-border bg-surface px-4 py-2.5">
		<button type="button" class="-ml-1 rounded-md p-1.5 text-muted hover:bg-background hover:text-foreground lg:hidden" aria-label="Show topics and filters" @click="drawer = true">
			<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
		</button>
		<a href="#/" class="text-heading whitespace-nowrap text-foreground">EU5 modifiers</a>
		<nav class="flex rounded-lg border border-border p-0.5" aria-label="View">
			<a v-for="v in views" :key="v.id" :href="'#/' + v.id" :aria-current="view === v.id ? 'page' : null"
				class="flex items-center gap-1.5 rounded-md px-3 py-1 text-label"
				:class="view === v.id ? 'bg-primary text-primary-foreground' : 'text-muted hover:text-foreground'">
				{{ v.label }} <span class="text-caption tabular-nums" :class="view === v.id ? '' : 'text-muted'">{{ v.count }}</span>
			</a>
		</nav>
		<div class="relative order-last w-full sm:order-none sm:w-auto sm:min-w-64 sm:flex-1 sm:max-w-xl">
			<svg class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-muted" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
			<input ref="searchEl" v-model="query" type="search" autocomplete="off" spellcheck="false"
				:placeholder="view === 'modifiers' ? 'Search by name, key or description' : 'Search advances, laws, buildings, events…'"
				:aria-label="view === 'modifiers' ? 'Search modifiers' : 'Search sources'" aria-controls="results"
				class="w-full rounded-lg border border-input bg-background py-2 pr-10 pl-9 text-body text-foreground placeholder:text-muted"
				@keydown="onSearchKey">
			<kbd v-if="!query" class="pointer-events-none absolute top-1/2 right-3 -translate-y-1/2 rounded border border-border px-1.5 text-caption text-muted">/</kbd>
		</div>
		<button type="button" class="ml-auto rounded-md p-1.5 text-muted hover:bg-background hover:text-foreground"
			:aria-label="theme === 'dark' ? 'Use light theme' : 'Use dark theme'" :data-tip="theme === 'dark' ? 'Use light theme' : 'Use dark theme'"
			@click="theme = theme === 'dark' ? 'light' : 'dark'">
			<svg v-if="theme === 'dark'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
			<svg v-else width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
		</button>
	</header>

	<div class="grid min-h-0 flex-1 grid-cols-[minmax(0,1fr)] grid-rows-[minmax(0,1fr)] lg:grid-cols-[15rem_minmax(0,1fr)]">
		<div v-if="drawer" class="fixed inset-0 z-30 bg-black/40 lg:hidden" @click="drawer = false"></div>
		<aside class="scroll-pane min-h-0 flex-col border-r border-border bg-surface pb-6"
			:class="drawer ? 'fixed inset-y-0 left-0 z-40 flex w-72 shadow-xl' : 'hidden lg:flex'"
			:aria-label="view === 'modifiers' ? 'Topics and filters' : 'Source types and filters'">
			<div class="flex items-center justify-between px-4 pt-4 lg:hidden">
				<span class="text-subheading">Browse</span>
				<button type="button" class="rounded-md p-1.5 text-muted hover:text-foreground" aria-label="Close" @click="drawer = false">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
				</button>
			</div>

			<template v-if="view === 'modifiers'">
				<h2 class="px-4 pt-4 pb-1 text-caption text-muted">Topics</h2>
				<nav aria-label="Topics">
					<button v-for="t in topicCounts" :key="t.name" type="button" :aria-pressed="topic === t.name"
						class="flex w-full items-center justify-between border-l-2 py-1.5 pr-4 pl-[calc(1rem-2px)] text-left text-label"
						:class="topic === t.name ? 'border-primary bg-primary-soft text-primary-strong' : 'border-transparent text-foreground hover:bg-background'"
						@click="pickTopic(t.name)">
						<span>{{ t.label }}</span>
						<span class="text-caption tabular-nums" :class="topic === t.name ? '' : 'text-muted'">{{ t.n.toLocaleString() }}</span>
					</button>
				</nav>

				<div class="mt-6 border-t border-border px-4 pt-4">
					<div class="flex items-baseline justify-between">
						<h2 class="text-caption text-muted">Refine</h2>
						<button v-if="filtersActive" type="button" class="text-caption text-secondary-strong hover:underline" @click="clearFilters">Clear filters</button>
					</div>
					<label class="mt-3 block">
						<span class="text-caption text-muted">Used by</span>
						<select v-model="system" class="mt-1 w-full rounded-md border border-input bg-background px-2 py-1.5 text-small text-foreground">
							<option value="">Any source type</option>
							<option v-for="s in systems" :key="s.name" :value="s.name">{{ s.name }} ({{ s.n }})</option>
						</select>
					</label>
					<chip-group v-for="g in modFilters" :key="g.id" :label="g.label" :options="g.options" v-model="filters[g.id]"></chip-group>
				</div>
			</template>

			<template v-else>
				<h2 class="px-4 pt-4 pb-1 text-caption text-muted">Source types</h2>
				<nav aria-label="Source types">
					<button v-for="k in kindCounts" :key="k.name" type="button" :aria-pressed="kind === k.name"
						class="flex w-full items-center justify-between border-l-2 py-1.5 pr-4 pl-[calc(1rem-2px)] text-left text-label"
						:class="kind === k.name ? 'border-primary bg-primary-soft text-primary-strong' : 'border-transparent text-foreground hover:bg-background'"
						@click="pickKind(k.name)">
						<span>{{ k.label }}</span>
						<span class="text-caption tabular-nums" :class="kind === k.name ? '' : 'text-muted'">{{ k.n.toLocaleString() }}</span>
					</button>
				</nav>
				<div class="mt-6 border-t border-border px-4 pt-1">
					<chip-group label="Content" :options="contentOptions" v-model="srcContent"></chip-group>
				</div>
			</template>
		</aside>

		<main ref="mainEl" id="results" class="scroll-pane min-h-0">
			<div class="mx-auto max-w-4xl px-4 pb-20 sm:px-6">
				<section class="pt-8 pb-5">
					<template v-if="view === 'modifiers'">
						<h1 class="text-title text-foreground">Country modifiers</h1>
						<p class="mt-3 max-w-prose text-body text-foreground">
							Every modifier a country can use in Europa Universalis V, read from your installed game and DLC on {{ stats.date }}:
							{{ stats.total.toLocaleString() }} modifiers, {{ stats.used.toLocaleString() }} of them used in vanilla script.
						</p>
						<details class="group mt-4 rounded-lg border border-border bg-surface">
							<summary class="flex cursor-pointer list-none items-center gap-2 px-4 py-2.5 text-label text-foreground [&::-webkit-details-marker]:hidden">
								<svg class="shrink-0 text-muted transition-transform duration-200 group-open:rotate-90" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
								How to read this
							</summary>
							<dl class="grid gap-x-6 gap-y-3 px-4 pt-1 pb-4 text-small sm:grid-cols-2">
								<div><dt class="font-semibold">Lowest, most common, highest</dt><dd class="text-muted">The fixed values the base game and DLC write. Pick something inside that range and your mod will feel like vanilla.</dd></div>
								<div><dt class="font-semibold">Written and in game</dt><dd class="text-muted">Written is what you type in script. Percent modifiers show it times 100: <code class="text-code">0.05</code> is +5%.</dd></div>
								<div><dt class="font-semibold">Green and red</dt><dd class="text-muted">Follow the game's own tooltip colours. Green means the value helps the country.</dd></div>
								<div><dt class="font-semibold">Scaled, computed and base values</dt><dd class="text-muted">Values the game multiplies, values from a formula, and the value every country starts with are listed apart and left out of the range.</dd></div>
								<div><dt class="font-semibold">What's left out</dt><dd class="text-muted">Location, character and religion modifiers don't work in a country modifier. Unit modifiers do, and apply to all of the country's units.</dd></div>
								<div><dt class="font-semibold">Check extreme values</dt><dd class="text-muted">Static modifiers the engine applies itself (difficulty, ruler skill) may be scaled in ways the files don't show. Open the source first.</dd></div>
								<div class="sm:col-span-2"><dt class="font-semibold">Keyboard</dt><dd class="text-muted"><kbd class="rounded border border-border px-1.5 text-caption">/</kbd> jumps to search. While searching, <kbd class="rounded border border-border px-1.5 text-caption">↑</kbd> <kbd class="rounded border border-border px-1.5 text-caption">↓</kbd> move between cards, <kbd class="rounded border border-border px-1.5 text-caption">Enter</kbd> opens or closes one, <kbd class="rounded border border-border px-1.5 text-caption">Esc</kbd> clears.</dd></div>
							</dl>
						</details>
					</template>
					<template v-else>
						<h1 class="text-title text-foreground">Sources</h1>
						<p class="mt-3 max-w-prose text-body text-foreground">
							Everything in the game files that gives a country a modifier: {{ sourceCount.toLocaleString() }} advances, laws,
							privileges, buildings, events and more. Open one to see every modifier it grants.
						</p>
					</template>
				</section>

				<div class="sticky top-0 z-10 -mx-4 flex items-center justify-between gap-3 border-b border-border bg-background/95 px-4 py-2 backdrop-blur sm:-mx-6 sm:px-6">
					<p class="text-small text-muted" aria-live="polite">{{ countText }}</p>
					<div class="flex items-center gap-1">
						<button v-if="openCount" type="button" class="rounded-md px-2 py-1 text-small text-muted hover:text-foreground" @click="collapseAll">Close all</button>
						<label class="flex items-center">
							<span class="sr-only">Sort</span>
							<select v-model="sort" class="rounded-md border border-transparent bg-transparent py-1 pr-1 text-small text-muted hover:border-border">
								<option v-if="query" value="match">Best match</option>
								<option value="name">Name A–Z</option>
								<option v-if="view === 'modifiers'" value="key">Key A–Z</option>
								<option value="uses">{{ view === 'modifiers' ? 'Most used' : 'Grants the most' }}</option>
							</select>
						</label>
					</div>
				</div>

				<a v-if="crossCount" :href="'#/' + otherView" class="mt-3 block rounded-lg bg-secondary-soft px-4 py-2 text-small text-secondary-strong hover:underline">
					{{ crossCount.toLocaleString() }} {{ otherView === 'sources' ? (crossCount === 1 ? 'source' : 'sources') : (crossCount === 1 ? 'modifier' : 'modifiers') }} also {{ crossCount === 1 ? 'matches' : 'match' }} “{{ query.trim() }}”
				</a>

				<ul class="mt-3 space-y-3">
					<template v-if="view === 'modifiers'">
						<li v-for="(m, i) in shown" :key="m.k">
							<mod-card :mod="m" :open="openMods.has(m.k)" :active="active === i" @toggle="toggle(m, i)" @topic="pickTopic"></mod-card>
						</li>
					</template>
					<template v-else>
						<li v-for="(s, i) in shown" :key="s.i">
							<src-card :src="s" :open="openSrcs.has(s.i)" :active="active === i" @toggle="toggle(s, i)"></src-card>
						</li>
					</template>
				</ul>
				<p v-if="list.length > limit" ref="sentinel" class="py-8 text-center text-small text-muted">Loading more…</p>
				<div v-if="!list.length" class="px-6 py-16 text-center">
					<p class="text-body text-foreground">{{ emptyText }}</p>
					<div class="mt-4 flex flex-wrap justify-center gap-2">
						<button v-if="view === 'modifiers' && topic" type="button" class="rounded-md border border-border px-3 py-1.5 text-label hover:bg-surface" @click="topic = ''">Search every topic</button>
						<button v-if="view === 'sources' && kind" type="button" class="rounded-md border border-border px-3 py-1.5 text-label hover:bg-surface" @click="kind = ''">Search every source type</button>
						<button v-if="filtersActive" type="button" class="rounded-md border border-border px-3 py-1.5 text-label hover:bg-surface" @click="clearFilters">Clear filters</button>
					</div>
				</div>
			</div>
		</main>
	</div>

	<div ref="tipEl" id="tip" role="tooltip" v-show="tip.open"
		class="pointer-events-none fixed top-0 left-0 z-50 max-w-xs rounded-md bg-neutral-900 px-2.5 py-1.5 text-caption whitespace-pre-line text-neutral-50 shadow-lg dark:bg-neutral-100 dark:text-neutral-900">{{ tip.text }}</div>
	<p class="sr-only" aria-live="polite">{{ copied ? 'Copied' : '' }}</p>
</div>
</script>

<script type="text/x-template" id="chip-group-template">
<fieldset class="mt-4">
	<legend class="text-caption text-muted">{{ label }}</legend>
	<div class="mt-1.5 flex flex-wrap gap-1.5">
		<button v-for="[value, text] in options" :key="value" type="button" :aria-pressed="modelValue === value"
			class="rounded-full border px-2.5 py-0.5 text-caption"
			:class="modelValue === value ? 'border-primary bg-primary text-primary-foreground' : 'border-border text-foreground hover:border-input'"
			@click="$emit('update:modelValue', value)">{{ text }}</button>
	</div>
</fieldset>
</script>

<script type="text/x-template" id="toggle-template">
<button type="button" class="flex w-full items-center gap-2 border-t border-border px-5 py-2.5 text-left text-label hover:bg-background"
	:class="open ? 'text-foreground' : 'text-secondary-strong'" :aria-expanded="open">
	<svg class="shrink-0 transition-transform duration-200" :class="open ? 'rotate-90' : ''" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
	<span>{{ open ? closeLabel : openLabel }}</span>
	<span v-if="detail" class="text-caption text-muted">{{ detail }}</span>
</button>
</script>

<script type="text/x-template" id="mod-card-template">
<article :id="'mod-' + mod.k" class="scroll-mt-14 overflow-hidden rounded-xl border bg-surface [contain-intrinsic-size:auto_220px] [content-visibility:auto]"
	:class="active ? 'border-primary ring-2 ring-primary-soft' : 'border-border'">
	<div class="px-5 pt-4 pb-4">
		<div class="flex items-start justify-between gap-4">
			<div class="min-w-0">
				<h2 class="text-subheading text-foreground" v-html="hl(mod.n)"></h2>
				<button type="button" class="mt-0.5 text-left text-code break-all text-primary-strong hover:underline"
					:data-tip="copied === mod.k ? 'Copied' : 'Copy the key'" @click="copy(mod.k)" v-html="hl(mod.k)"></button>
			</div>
			<button type="button" class="shrink-0 rounded-full border border-border px-2.5 py-0.5 text-caption text-muted hover:border-input hover:text-foreground"
				:data-tip="'Show every modifier in ' + mod.tp" @click="$emit('topic', mod.tp)">{{ mod.tp }}</button>
		</div>
		<div class="mt-2.5 flex flex-wrap gap-1.5">
			<span v-for="b in badges" :key="b.text" class="rounded-full px-2 py-0.5 text-caption" :class="b.cls" :data-tip="b.tip">{{ b.text }}</span>
		</div>
		<p v-if="mod.d" class="mt-2.5 max-w-prose text-small text-muted" v-html="hl(mod.d)"></p>

		<div v-if="stats.length" class="mt-4 grid gap-2" :class="stats.length === 3 ? 'sm:grid-cols-3' : 'sm:grid-cols-[minmax(0,1fr)_2fr]'">
			<div v-for="s in stats" :key="s.label" class="min-w-0 rounded-lg border border-border bg-background px-3 py-2.5">
				<div class="text-caption text-muted">{{ s.label }}</div>
				<div class="mt-0.5 flex items-baseline gap-2">
					<span class="text-subheading tabular-nums" :class="toneText(s.v)">{{ disp(s.v, mod.t) }}</span>
					<span v-if="mod.t !== 'f'" class="text-caption text-muted tabular-nums">written {{ fnum(s.v) }}</span>
				</div>
				<div class="mt-0.5 truncate text-caption">
					<source-link v-if="s.src" :s="s.src"></source-link>
					<span v-else class="text-muted">{{ s.note }}</span>
				</div>
			</div>
		</div>
		<p v-if="notes.length" class="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-small text-muted">
			<span v-for="n in notes" :key="n">{{ n }}</span>
		</p>
	</div>
	<expand-toggle :open="open" open-label="Show details" close-label="Hide details" :detail="moreText" @click="$emit('toggle')"></expand-toggle>
	<transition enter-from-class="opacity-0 -translate-y-1" enter-active-class="transition duration-200 ease-out" leave-active-class="transition duration-100 ease-in" leave-to-class="opacity-0">
		<mod-detail v-if="open" :mod="mod"></mod-detail>
	</transition>
</article>
</script>

<script type="text/x-template" id="mod-detail-template">
<div class="border-t border-border bg-background px-5 py-6 sm:px-6">
	<p class="max-w-prose text-small text-foreground">{{ usageText }}</p>

	<template v-if="d.values.length">
		<value-ruler :mod="mod" :values="d.values" :picked="picked" @pick="pickValue"></value-ruler>

		<div class="mt-8 flex items-baseline justify-between gap-4">
			<h3 class="text-label font-semibold text-foreground">Fixed values</h3>
			<span class="text-caption text-muted">lowest first</span>
		</div>
		<ol class="mt-2 divide-y divide-border overflow-hidden rounded-lg border border-border bg-surface">
			<li v-for="e in shownValues" :key="e.v" :id="rowId(e.v)"
				class="grid grid-cols-[5.5rem_minmax(0,1fr)] gap-x-4 px-3 py-2.5 transition-colors sm:grid-cols-[5.5rem_8rem_minmax(0,1fr)]"
				:class="picked === e.v ? 'bg-primary-soft' : ''">
				<div>
					<div class="text-label tabular-nums" :class="toneText(e.v)">{{ disp(e.v, mod.t) }}</div>
					<div v-if="mod.t !== 'f'" class="text-caption text-muted tabular-nums">{{ fnum(e.v) }}</div>
				</div>
				<div class="hidden items-center gap-2 pt-1.5 sm:flex sm:self-start" :data-tip="`Used ${e.n} of ${fixedTotal} times`">
					<span class="h-1.5 flex-1 overflow-hidden rounded-full bg-border">
						<span class="block h-full rounded-full" :class="toneBg(e.v)" :style="{ width: Math.max(4, (e.n / maxN) * 100) + '%' }"></span>
					</span>
					<span class="w-9 text-right text-caption text-muted tabular-nums">{{ e.n }}×</span>
				</div>
				<div class="min-w-0 text-small">
					<span class="mr-1 text-caption text-muted sm:hidden">{{ e.n }}×</span>
					<source-list :sources="e.srcs"></source-list>
					<p v-if="e.via.length" class="mt-1 text-caption text-muted">Written as <code class="text-code break-all">{{ e.via.join(', ') }}</code></p>
				</div>
			</li>
		</ol>
		<button v-if="d.values.length > 12" type="button" class="mt-2 text-caption text-secondary-strong hover:underline" @click="all.values = !all.values">
			{{ all.values ? 'Show fewer values' : 'Show all ' + d.values.length + ' values' }}
		</button>
	</template>

	<div v-if="d.base.length" class="mt-6 rounded-lg border border-info-soft bg-info-soft/50 px-4 py-3 text-small">
		<p v-for="(g, i) in d.base" :key="i">
			<span class="text-foreground">Every country starts with </span>
			<span v-if="g.v != null" class="font-semibold tabular-nums" :class="toneText(g.v)">{{ disp(g.v, mod.t) }}</span>
			<code v-else class="text-code">{{ g.note }}</code>
			<span class="text-muted">{{ ' from ' }}</span><source-link :s="g.s"></source-link><span class="text-muted">. It isn't counted in the range.</span>
		</p>
	</div>

	<template v-if="d.scaled.length">
		<h3 class="mt-8 text-label font-semibold text-foreground">Scaled at runtime</h3>
		<p class="text-caption text-muted">The game multiplies these, so the written number isn't the real effect.</p>
		<ul class="mt-2 divide-y divide-border overflow-hidden rounded-lg border border-border bg-surface">
			<li v-for="(g, i) in shownScaled" :key="i" class="grid grid-cols-[5.5rem_minmax(0,1fr)] gap-x-4 px-3 py-2.5">
				<div>
					<div class="text-label tabular-nums" :class="toneText(g.v)">{{ disp(g.v, mod.t) }}</div>
					<div v-if="mod.t !== 'f'" class="text-caption text-muted tabular-nums">{{ fnum(g.v) }}</div>
				</div>
				<div class="min-w-0 text-small">
					<div class="text-foreground">{{ humanize(g.note) }}</div>
					<div class="text-caption"><source-link :s="g.s"></source-link></div>
				</div>
			</li>
		</ul>
		<button v-if="d.scaled.length > 6" type="button" class="mt-2 text-caption text-secondary-strong hover:underline" @click="all.scaled = !all.scaled">
			{{ all.scaled ? 'Show fewer' : 'Show all ' + d.scaled.length }}
		</button>
	</template>

	<template v-if="d.dyn.length">
		<h3 class="mt-8 text-label font-semibold text-foreground">Computed from game state</h3>
		<p class="text-caption text-muted">A formula that depends on the country, so there's no single number.</p>
		<ul class="mt-2 divide-y divide-border overflow-hidden rounded-lg border border-border bg-surface">
			<li v-for="(g, i) in shownDyn" :key="i" class="px-3 py-2.5 text-small">
				<code class="text-code break-all text-foreground">{{ g.note }}</code>
				<div class="text-caption"><source-link :s="g.s"></source-link></div>
			</li>
		</ul>
		<button v-if="d.dyn.length > 6" type="button" class="mt-2 text-caption text-secondary-strong hover:underline" @click="all.dyn = !all.dyn">
			{{ all.dyn ? 'Show fewer' : 'Show all ' + d.dyn.length }}
		</button>
	</template>

	<template v-if="d.flags.length">
		<h3 class="mt-8 text-label font-semibold text-foreground">Granted by</h3>
		<div class="mt-2 rounded-lg border border-border bg-surface px-3 py-2.5 text-small"><source-list :sources="d.flags" :initial="12"></source-list></div>
	</template>

	<div class="mt-8 grid gap-3 md:grid-cols-2">
		<section class="rounded-lg border border-border bg-surface p-4">
			<h3 class="text-label font-semibold text-foreground">Definition</h3>
			<dl class="mt-3 grid grid-cols-[minmax(5.5rem,auto)_minmax(0,1fr)] gap-x-4 gap-y-2 text-small">
				<template v-for="f in facts" :key="f.label">
					<dt class="text-muted">{{ f.label }}</dt>
					<dd :class="f.cls || 'text-foreground'">{{ f.text }}</dd>
				</template>
			</dl>
		</section>
		<section class="flex flex-col rounded-lg border border-border bg-surface p-4">
			<h3 class="text-label font-semibold text-foreground">Use it</h3>
			<p class="mt-1 text-caption text-muted">A static modifier in the format the game's own files use, with the most common vanilla value.</p>
			<pre class="mt-3 flex-1 overflow-x-auto rounded-md border border-border bg-background px-3 py-2.5 text-code text-foreground [tab-size:4]"><code>{{ snippet }}</code></pre>
			<div class="mt-3 flex flex-wrap gap-2">
				<button type="button" class="rounded-md bg-primary px-3 py-1.5 text-label text-primary-foreground hover:bg-[color-mix(in_oklab,var(--primary),var(--primary-strong)_25%)]" @click="copy(snippet)">
					{{ copied === snippet ? 'Copied' : 'Copy block' }}
				</button>
				<button type="button" class="rounded-md border border-border px-3 py-1.5 text-label text-foreground hover:bg-background" @click="copy(line)">
					{{ copied === line ? 'Copied' : 'Copy line only' }}
				</button>
			</div>
		</section>
	</div>

	<section v-if="d.related.length" class="mt-8">
		<h3 class="text-label font-semibold text-foreground">Related modifiers</h3>
		<ul class="mt-2 flex flex-wrap gap-2">
			<li v-for="r in d.related" :key="r.k">
				<a :href="'#/modifiers/' + encodeURIComponent(r.k)" :data-tip="r.k"
					class="inline-block rounded-full border border-border bg-surface px-3 py-1 text-label text-secondary-strong hover:border-secondary hover:bg-secondary-soft">{{ r.n }}</a>
			</li>
		</ul>
	</section>
</div>
</script>

<script type="text/x-template" id="value-ruler-template">
<figure class="mt-5 rounded-lg border border-border bg-surface px-4 pt-3 pb-2">
	<div class="relative mx-2 h-28 select-none">
		<button v-for="t in ticks" :key="t.v" type="button" :data-tip="t.tip" :aria-label="t.label"
			class="group absolute bottom-[3.25rem] flex w-3 -translate-x-1/2 flex-col items-center"
			:style="{ left: t.x + '%', height: t.h + 'px' }" @click="$emit('pick', t.v)">
			<span v-if="t.top || t.v === picked" class="-mb-0.5 size-2 shrink-0 rounded-full" :class="t.bg"></span>
			<span class="w-[3px] flex-1 rounded-t-full" :class="[t.bg, t.top || t.v === picked ? 'opacity-100' : 'opacity-55 group-hover:opacity-100']"></span>
		</button>
		<span v-if="top" class="absolute -translate-x-1/2 text-caption whitespace-nowrap text-foreground"
			:style="{ left: clampLabel(top.x) + '%', bottom: (3.25 + top.h / 16 + 0.35) + 'rem' }">
			{{ disp(top.v, mod.t) }} <span class="text-muted">most common</span>
		</span>
		<div class="scale-bar absolute right-0 bottom-10 left-0 h-3 rounded-[1px]"></div>
		<div v-if="zero !== null" class="absolute bottom-8 h-7 w-px bg-foreground" :style="{ left: zero + '%' }"></div>
		<span class="absolute bottom-2 left-0 text-caption tabular-nums" :class="toneText(lo)">{{ disp(lo, mod.t) }}</span>
		<span v-if="zero !== null && zero > 12 && zero < 88" class="absolute bottom-2 -translate-x-1/2 text-caption text-muted" :style="{ left: zero + '%' }">0</span>
		<span class="absolute right-0 bottom-2 text-caption tabular-nums" :class="toneText(hi)">{{ disp(hi, mod.t) }}</span>
	</div>
	<figcaption class="border-t border-border pt-2 text-caption text-muted">Each tick is a value vanilla writes; taller ones are used more often. Hover a tick to see where, click it to find it below.</figcaption>
</figure>
</script>

<script type="text/x-template" id="source-link-template">
<a :href="'#/sources/' + s.i" class="text-secondary-strong hover:underline" :data-tip="tipText">{{ s.title }}</a>{{ ' ' }}<span class="text-caption text-muted">{{ s.kind.toLowerCase() }}</span><template v-if="s.dlc">{{ ' ' }}<span class="text-caption text-tertiary-strong">{{ s.dlc }}</span></template>
</script>

<script type="text/x-template" id="source-list-template">
<span>
	<template v-for="(s, i) in visible" :key="s.i"><source-link :s="s"></source-link><span v-if="i < visible.length - 1" class="text-muted">{{ ', ' }}</span></template>
	<template v-if="sources.length > initial">{{ ' ' }}<button type="button" class="text-caption text-secondary-strong hover:underline" @click="open = !open">
		{{ open ? 'show fewer' : '+' + (sources.length - initial) + ' more' }}
	</button></template>
</span>
</script>

<script type="text/x-template" id="src-card-template">
<article :id="'src-' + src.i" class="scroll-mt-14 overflow-hidden rounded-xl border bg-surface [contain-intrinsic-size:auto_220px] [content-visibility:auto]"
	:class="active ? 'border-primary ring-2 ring-primary-soft' : 'border-border'">
	<div class="px-5 pt-4 pb-4">
		<div class="flex items-start justify-between gap-4">
			<h2 class="min-w-0 text-subheading text-foreground" v-html="hl(src.title)"></h2>
			<span class="shrink-0 pt-1 text-caption text-muted tabular-nums">{{ src.g.length }} {{ src.g.length === 1 ? 'grant' : 'grants' }}</span>
		</div>
		<div class="mt-1.5 flex flex-wrap items-center gap-x-2 gap-y-1">
			<span class="rounded-full bg-background px-2 py-0.5 text-caption text-muted">{{ src.kind }}</span>
			<span v-if="src.dlc" class="rounded-full bg-tertiary-soft px-2 py-0.5 text-caption text-tertiary-strong">{{ src.dlc }}</span>
			<code class="text-code break-all text-muted" v-html="hl(src.obj)"></code>
		</div>
		<p class="mt-2.5 text-small text-muted">
			<template v-for="(p, i) in preview" :key="i"><span class="text-foreground">{{ p.name }}</span>{{ ' ' }}<span class="tabular-nums" :class="p.tone">{{ p.value }}</span><span v-if="i < preview.length - 1">{{ ', ' }}</span></template>
			<span v-if="src.g.length > preview.length">{{ ' and ' + (src.g.length - preview.length) + ' more' }}</span>
		</p>
	</div>
	<expand-toggle :open="open" open-label="Show what it grants" close-label="Hide grants" @click="$emit('toggle')"></expand-toggle>
	<transition enter-from-class="opacity-0 -translate-y-1" enter-active-class="transition duration-200 ease-out" leave-active-class="transition duration-100 ease-in" leave-to-class="opacity-0">
		<src-detail v-if="open" :src="src"></src-detail>
	</transition>
</article>
</script>

<script type="text/x-template" id="src-detail-template">
<div class="border-t border-border bg-background px-5 py-5 sm:px-6">
	<ul class="divide-y divide-border overflow-hidden rounded-lg border border-border bg-surface">
		<li v-for="(r, i) in rows" :key="i" class="grid grid-cols-[5.5rem_minmax(0,1fr)] gap-x-4 px-3 py-2.5">
			<div>
				<div class="text-label tabular-nums" :class="r.tone">{{ r.shown || r.written }}</div>
				<div v-if="r.shown" class="text-caption text-muted tabular-nums">{{ r.written }}</div>
			</div>
			<div class="min-w-0">
				<a :href="'#/modifiers/' + encodeURIComponent(r.m.k)" class="text-label text-secondary-strong hover:underline">{{ r.m.n }}</a>
				<div class="text-code break-all text-muted">{{ r.m.k }}</div>
				<p v-if="r.note" class="mt-0.5 text-caption text-muted">{{ r.note }}<template v-if="r.code">{{ ' ' }}<code class="text-code break-all">{{ r.code }}</code></template></p>
			</div>
		</li>
	</ul>
	<p class="mt-3 text-caption text-muted">Defined in <code class="text-code break-all">{{ src.file }}</code></p>
</div>
</script>
