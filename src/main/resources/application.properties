spring.application.name=EUVModCreatorBack

spring.profiles.default=local
spring.threads.virtual.enabled=true

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP_WITH_TIMEZONE

# --- Flyway ---
spring.flyway.locations=classpath:db/migration

# --- Logging ---
logging.pattern.correlation=%replace([%X{requestId} %X{clientIp}] ){'^\\[ \\] $', ''}
spring.mvc.log-resolved-exception=false
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=15
logging.logback.rollingpolicy.total-size-cap=2GB
