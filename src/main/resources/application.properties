spring.application.name=EUVModCreatorBack

# Used when no profile is explicitly activated. Production sets SPRING_PROFILES_ACTIVE=production.
spring.profiles.default=local

# Each HTTP request runs on a virtual thread, so blocking code still scales.
spring.threads.virtual.enabled=true

# --- JPA / Hibernate ---
# Flyway owns the schema. Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Release the DB connection when the service method ends, not when the response is written.
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.locations=classpath:db/migration
