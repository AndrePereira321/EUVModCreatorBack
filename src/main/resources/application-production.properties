spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# --- Hikari ---
spring.datasource.hikari.pool-name=euvmodcreator
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=7000
spring.datasource.hikari.leak-detection-threshold=30000

# --- JWT ---
# Base64 of at least 32 random bytes (openssl rand -base64 32). Rotating it logs every user out of their access token.
app.jwt.secret=${JWT_SECRET}
