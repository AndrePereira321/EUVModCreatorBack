# Integration tests run against their own schema in the local database, so the tables they empty before every
# test never hold dev data. Flyway creates the schema and runs every migration on the first test run.
spring.datasource.url=jdbc:postgresql://localhost:5432/euvmodcreator?currentSchema=test
spring.datasource.username=euvmodcreator
spring.datasource.password=euvmodcreator
spring.flyway.schemas=test

# auth.jwt.secret is not here: IntegrationTest generates a fresh one per run, so no key lives in a committed file.

# CorsTest calls the API as the Vite dev server would.
web.cors.allowed-origins=http://localhost:5173
